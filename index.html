<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница недоступна</title>
    <style>
        body {
            background-color: #ffffff;
            color: #1a1a1b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .content {
            max-width: 500px;
        }

        img {
            max-width: 280px;
            height: auto;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #000000;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            color: #5c5c5c;
            margin-bottom: 25px;
        }

        .info-block {
            font-size: 14px;
            color: #878a8c;
            border-top: 1px solid #edeff1;
            padding-top: 20px;
        }

        .evidence {
            display: block;
            margin-top: 8px;
            font-weight: 500;
            color: #1a1a1b;
        }
    </style>
</head>
<body>

    <div class="content">
        <img src="https://s2.ezgif.com/tmp/ezgif-26771dc58dffc931.png" alt="Status Image">
        
        <h1>Сайт закрыт или вышел из строя</h1>
        <p>К сожалению, запрашиваемый ресурс больше не доступен для просмотра.</p>
        
        <div class="info-block">
            Причина / Доказательства:
            <span class="evidence">Информации о этом не должны существовать.</span>
        </div>
    </div>

</body>
</html>
