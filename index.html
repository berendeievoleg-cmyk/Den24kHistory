<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница недоступна</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
        }
        
        body {
            background-color: #ffffff;
            color: #1a1a1b;
            font-family: -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: background-color 0.1s;
        }

        .content {
            max-width: 500px;
            padding: 20px;
        }

        img#trigger-img {
            max-width: 280px;
            height: auto;
            margin-bottom: 30px;
            cursor: pointer;
        }

        /* Глитч при нажатиях */
        .glitch-active {
            animation: heavy-glitch 0.1s infinite;
        }

        @keyframes heavy-glitch {
            0% { transform: translate(5px, 0); filter: hue-rotate(90deg); }
            50% { transform: translate(-5px, 5px) invert(1); }
            100% { transform: translate(0, -5px); }
        }

        /* Черный экран */
        #secret-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background: black;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 3s ease; /* Для плавного покраснения */
        }

        /* Плавное появление для картинки и текста */
        #secret-img, #secret-text {
            opacity: 0;
            transition: opacity 2s ease, filter 3s ease, color 3s ease;
        }

        #secret-img {
            max-width: 85%;
            margin-bottom: 30px;
        }

        #secret-text {
            color: white;
            font-size: 19px;
            font-family: serif;
            padding: 0 20px;
        }

        /* Класс для тотального покраснения */
        .everything-red {
            background-color: #8b0000 !important;
        }
        .everything-red #secret-text {
            color: #000000 !important; /* Текст становится черным на красном фоне */
        }
        .everything-red #secret-img {
            filter: sepia(1) saturate(10) hue-rotate(-50deg); /* Картинка окрашивается в красный */
        }
    </style>
</head>
<body>

    <div class="content" id="main-content">
        <img src="https://raw.githubusercontent.com/berendeievoleg-cmyk/Den24kHistory/refs/heads/main/IMG_20260502_143040_983.png" alt="Status Image" id="trigger-img">
        <h1>Сайт закрыт или вышел из строя</h1>
        <p>К сожалению, запрашиваемый ресурс больше не доступен для просмотра.</p>
        <div style="font-size: 14px; color: #878a8c; border-top: 1px solid #edeff1; padding-top: 20px;">
            Причина / Доказательства:
            <span style="display: block; margin-top: 8px; font-weight: 500; color: #1a1a1b;">Информации о этом не должны существовать.</span>
        </div>
    </div>

    <div id="secret-screen">
        <img id="secret-img" src="https://raw.githubusercontent.com/berendeievoleg-cmyk/Den24kHistory/refs/heads/main/%D0%91%D0%B5%D0%B7%20%D0%BD%D0%B0%D0%B7%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F258_20260502155248.png">
        <div id="secret-text">Как бы странно это не звучало но... Мог ли ты отсюда уйти?</div>
    </div>

    <script>
        let clicks = 0;
        const triggerImg = document.getElementById('trigger-img');
        const mainContent = document.getElementById('main-content');
        const secretScreen = document.getElementById('secret-screen');
        const secretImg = document.getElementById('secret-img');
        const secretText = document.getElementById('secret-text');

        triggerImg.addEventListener('click', () => {
            clicks++;
            if (clicks === 3) {
                mainContent.classList.add('glitch-active');

                // 1. Через 3 сек — ТЕМНОТА
                setTimeout(() => {
                    mainContent.style.display = 'none';
                    secretScreen.style.display = 'flex';

                    // 2. Через 3 сек — Проявление КАРТИНКИ
                    setTimeout(() => {
                        secretImg.style.opacity = '1';
                        
                        // 3. Через 3 сек — Проявление ТЕКСТА
                        setTimeout(() => {
                            secretText.style.opacity = '1';

                            // 4. Через 3 сек — КРАСНЕЕТ ВСЁ (фон, текст, фото)
                            setTimeout(() => {
                                secretScreen.classList.add('everything-red');
                                
                                // 5. Через 3 сек — БЕЛЫЙ ЭКРАН
                                setTimeout(() => {
                                    secretScreen.style.display = 'none';
                                    document.body.style.backgroundColor = 'white';
                                }, 3000);

                            }, 3000);
                        }, 3000);
                    }, 3000);

                }, 3000);
            }
        });
    </script>

</body>
</html>
