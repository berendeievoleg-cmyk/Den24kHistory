<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ ограничен</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            border: 1px solid #333;
            padding: 30px;
            background: #111;
        }
        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 25px;
            border: 1px solid #444;
        }
        h1 {
            color: #ff4d4d;
            font-size: 1.5rem;
            text-transform: uppercase;
        }
        .reason {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-left: 3px solid #ff4d4d;
            font-style: italic;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://s2.ezgif.com/tmp/ezgif-26771dc58dffc931.png" alt="System Error">
        <h1>Сайт закрыт / Вышел из строя</h1>
        <p>К сожалению, данный ресурс больше не доступен.</p>
        <div class="reason">
            <strong>Причина / Доказательства:</strong><br>
            Информации о этом не должны существовать.
        </div>
    </div>
</body>
</html>
